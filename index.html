<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGLOO | Next Generation Consumer Brands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>
    <canvas id="plexus-canvas"></canvas>

    <!-- UI Overlay matching Igloo Inc hero reference -->
    <header class="overlay-header">
      <div class="brand-block">
        <h1 class="brand-logo">IGLOO</h1>
        <div class="brand-meta">
          <p class="copyright-line">// Copyright &copy; 2026</p>
          <div class="company-info">
            <p>Igloo, Inc.</p>
            <p>All Rights Reserved.</p>
          </div>
        </div>
      </div>

      <div class="manifesto-block" id="hero-manifesto">
        <div class="manifesto-title">////// Manifesto</div>
        <p class="manifesto-text">
          Our mission is to<br>
          build the next<br>
          generation of<br>
          consumer brands at<br>
          the intersection<br>
          of Community, AI,<br>
          and crypto.
        </p>
      </div>
    </header>


    <footer class="overlay-footer">
      <button id="sound-btn" class="sound-toggle" aria-label="Toggle Sound" title="Toggle Sound">
        <svg class="sound-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <div id="status-container" class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Loading scene...</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
